<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
      --border: #222; --border2: #333; --text: #f0f0f0; --muted: #555;
      --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 2rem 1rem 5rem;
      display: flex; flex-direction: column; align-items: center;
    }
    .page { width: 100%; max-width: 660px; display: flex; flex-direction: column; gap: 2rem; }

    a.back { color: var(--muted); text-decoration: none; font-size: 0.78rem; letter-spacing: 0.05em; }
    a.back:hover { color: var(--text); }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
    h2 { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

    section { display: flex; flex-direction: column; gap: 0.75rem; }

    .btn {
      padding: 0.5rem 1rem; border-radius: 7px; font-size: 0.73rem; font-weight: 700;
      cursor: pointer; letter-spacing: 0.07em; text-transform: uppercase;
      border: 1px solid var(--border2); transition: border-color 0.15s, background 0.15s;
      white-space: nowrap; align-self: flex-start;
    }
    .btn-default { background: var(--surface2); color: var(--text); }
    .btn-default:hover { border-color: #4a4a4a; }
    .btn-danger { background: #1a0808; color: var(--red); border-color: #3d1a1a; }
    .btn-danger:hover { background: #2a1010; }
    .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.63rem; align-self: auto; }

    .msg { font-size: 0.75rem; color: var(--muted); min-height: 1.2em; }
    .msg.ok  { color: var(--green); }
    .msg.err { color: var(--red); }

    /* Player cards */
    .player-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .player-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1rem; gap: 1rem;
      cursor: pointer; user-select: none;
    }
    .player-header:hover { background: var(--surface2); }
    .player-header.open { border-bottom: 1px solid var(--border); }

    .player-left { display: flex; flex-direction: column; gap: 0.15rem; flex: 1; min-width: 0; }
    .player-sid { font-size: 0.7rem; font-family: monospace; color: var(--muted); }
    .player-count { font-size: 0.75rem; font-weight: 700; color: var(--text); }

    .player-actions { display: flex; gap: 0.4rem; align-items: center; }
    .chevron { color: var(--muted); font-size: 0.7rem; transition: transform 0.2s; flex-shrink: 0; }
    .player-header.open .chevron { transform: rotate(180deg); }

    .player-body { display: none; padding: 0.75rem 1rem; }
    .player-body.open { display: block; }

    /* Achievement rows */
    .ach-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .ach-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.6rem; border-radius: 7px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .ach-icon { font-size: 1.1rem; flex-shrink: 0; }
    .ach-info { flex: 1; min-width: 0; }
    .ach-name { font-size: 0.78rem; font-weight: 700; }
    .ach-meta { font-size: 0.65rem; color: var(--muted); margin-top: 0.1rem; }
    .ach-meta .game-tag { color: var(--gold); margin-right: 0.4rem; }

    .empty-msg { font-size: 0.75rem; color: var(--muted); padding: 0.5rem 0; text-align: center; }
    .total-bar { display: flex; align-items: center; justify-content: space-between; }
    .total-count { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
<div class="page">
  <header style="display:flex;flex-direction:column;gap:0.4rem">
    <a href="/admin/" class="back">← Admin</a>
    <h1>Achievements</h1>
  </header>

  <section>
    <h2>Actions</h2>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
      <button class="btn btn-default" id="refreshBtn">Refresh</button>
      <button class="btn btn-danger"  id="resetAllBtn">Reset All Players</button>
    </div>
    <p class="msg" id="actionMsg"></p>
  </section>

  <section>
    <div class="total-bar">
      <h2>Players</h2>
      <span class="total-count" id="totalCount"></span>
    </div>
    <div style="display:flex;gap:0.5rem">
      <input id="sidFilter" type="text" placeholder="Filter by session ID…"
        style="flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;
               padding:0.5rem 0.75rem;color:var(--text);font-size:0.78rem;font-family:monospace;outline:none">
      <select id="sidJump" style="background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:0.5rem 0.75rem;color:var(--text);font-size:0.78rem;font-family:monospace;outline:none;cursor:pointer;max-width:220px">
        <option value="">— Jump to player —</option>
      </select>
    </div>
    <div id="playerList"><p class="msg">Loading…</p></div>
  </section>
</div>

<script src="/games/achievements.js"></script>
<script>
  const ACH_MAP = Object.fromEntries(ALL_ACHIEVEMENTS.map(a => [a.id, a]));

  function setMsg(text, type = '') {
    const el = document.getElementById('actionMsg');
    el.textContent = text; el.className = `msg ${type}`;
    if (text) setTimeout(() => { if (el.textContent === text) { el.textContent = ''; el.className = 'msg'; } }, 3000);
  }

  function fmt(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  let players = [];

  async function load() {
    document.getElementById('playerList').innerHTML = '<p class="msg">Loading…</p>';
    try {
      players = await fetch('/admin/api/achievements').then(r => r.json());
      const jump = document.getElementById('sidJump');
      jump.innerHTML = '<option value="">— Jump to player —</option>';
      players.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.sid;
        opt.textContent = `…${p.sid.slice(-12)}  (${p.achievements.length} ach)`;
        jump.appendChild(opt);
      });
      render();
    } catch {
      document.getElementById('playerList').innerHTML = '<p class="msg err">Failed to load.</p>';
    }
  }

  document.getElementById('sidFilter').addEventListener('input', render);

  document.getElementById('sidJump').addEventListener('change', function() {
    if (!this.value) return;
    document.getElementById('sidFilter').value = '';
    render();
    // Expand and scroll to the selected player card
    const hdr = document.getElementById('ph-' + this.value);
    const body = document.getElementById('pb-' + this.value);
    if (hdr && body && !body.classList.contains('open')) {
      hdr.classList.add('open');
      body.classList.add('open');
    }
    if (hdr) setTimeout(() => hdr.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    this.value = '';
  });

  function render() {
    const filterVal = document.getElementById('sidFilter').value.trim().toLowerCase();
    const visible   = filterVal ? players.filter(p => p.sid.toLowerCase().includes(filterVal)) : players;

    document.getElementById('totalCount').textContent =
      players.length ? `${visible.length}/${players.length} player${players.length !== 1 ? 's' : ''}` : '';

    if (!visible.length) {
      document.getElementById('playerList').innerHTML =
        `<p class="msg">${players.length ? 'No players match that ID.' : 'No achievements unlocked yet.'}</p>`;
      return;
    }

    document.getElementById('playerList').innerHTML = visible.map((p, pi) => {
      const shortSid = p.sid.slice(-8);
      const rows = p.achievements.map(a => {
        const def = ACH_MAP[a.id];
        return `<div class="ach-row" id="ach-${p.sid}-${a.id}">
          <div class="ach-icon">${def?.icon ?? '🏅'}</div>
          <div class="ach-info">
            <div class="ach-name">${def?.title ?? a.id}</div>
            <div class="ach-meta">
              <span class="game-tag">${def?.game ?? '—'}</span>
              ${fmt(a.unlockedAt)}
            </div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="deleteAch('${p.sid}','${a.id}')">Remove</button>
        </div>`;
      }).join('');

      return `<div class="player-card" id="pc-${p.sid}">
        <div class="player-header" id="ph-${p.sid}" onclick="togglePlayer('${p.sid}')">
          <div class="player-left">
            <div class="player-count">${p.achievements.length} achievement${p.achievements.length !== 1 ? 's' : ''}</div>
            <div class="player-sid">…${shortSid}</div>
          </div>
          <div class="player-actions" onclick="event.stopPropagation()">
            <button class="btn btn-danger btn-sm" onclick="deletePlayer('${p.sid}')">Reset Player</button>
          </div>
          <div class="chevron">▼</div>
        </div>
        <div class="player-body" id="pb-${p.sid}">
          <div class="ach-list">${rows || '<p class="empty-msg">No achievements.</p>'}</div>
        </div>
      </div>`;
    }).join('');
  }

  function togglePlayer(sid) {
    document.getElementById('ph-' + sid).classList.toggle('open');
    document.getElementById('pb-' + sid).classList.toggle('open');
  }

  async function deletePlayer(sid) {
    if (!confirm(`Reset all achievements for player …${sid.slice(-8)}?`)) return;
    try {
      await fetch(`/admin/api/achievements?sid=${encodeURIComponent(sid)}`, { method: 'DELETE' });
      players = players.filter(p => p.sid !== sid);
      render();
      setMsg('Player achievements reset.', 'ok');
    } catch { setMsg('Failed.', 'err'); }
  }

  async function deleteAch(sid, id) {
    try {
      await fetch(`/admin/api/achievements?sid=${encodeURIComponent(sid)}&id=${encodeURIComponent(id)}`, { method: 'DELETE' });
      const player = players.find(p => p.sid === sid);
      if (player) {
        player.achievements = player.achievements.filter(a => a.id !== id);
        if (player.achievements.length === 0) players = players.filter(p => p.sid !== sid);
      }
      render();
      setMsg('Achievement removed.', 'ok');
    } catch { setMsg('Failed.', 'err'); }
  }

  document.getElementById('refreshBtn').addEventListener('click', () => { load(); setMsg('Refreshed.', 'ok'); });

  document.getElementById('resetAllBtn').addEventListener('click', async () => {
    if (!confirm('Reset ALL achievements for ALL players? This cannot be undone.')) return;
    try {
      const res  = await fetch('/admin/api/achievements?all=true', { method: 'DELETE' });
      const data = await res.json();
      players = [];
      render();
      setMsg(`Deleted ${data.deleted} player record(s).`, 'ok');
    } catch { setMsg('Failed.', 'err'); }
  });

  load();
</script>
</body>
</html>
