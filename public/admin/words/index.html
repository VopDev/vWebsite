<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
      --border: #222; --border2: #333; --text: #f0f0f0; --muted: #555;
      --green: #538d4e; --yellow: #b59f3b; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 2rem 1rem 5rem;
      display: flex; flex-direction: column; align-items: center;
    }
    .page { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 2rem; }
    a.back { color: var(--muted); text-decoration: none; font-size: 0.78rem; letter-spacing: 0.05em; }
    a.back:hover { color: var(--text); }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
    h2 { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    section { display: flex; flex-direction: column; gap: 0.75rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; }

    /* Today */
    .today-word { font-size: 2.5rem; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; padding: 0.5rem 0; }
    .today-seed { font-size: 0.7rem; color: var(--muted); text-align: center; font-family: monospace; letter-spacing: 0.1em; }

    /* Stat tiles */
    .stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 0.6rem; }
    .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 0.6rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; text-align: center; }
    .stat-tile .val { font-size: 1.5rem; font-weight: 800; line-height: 1; }
    .stat-tile .lbl { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .stat-tile .sub { font-size: 0.65rem; color: var(--muted); }

    /* Distribution bars */
    .dist-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .dist-row { display: flex; align-items: center; gap: 0.6rem; }
    .dist-label { font-size: 0.72rem; font-weight: 700; width: 18px; text-align: right; flex-shrink: 0; }
    .dist-track { flex: 1; height: 22px; background: var(--border2); border-radius: 3px; overflow: hidden; }
    .dist-fill { height: 100%; background: var(--green); display: flex; align-items: center; padding-left: 6px; font-size: 0.65rem; font-weight: 700; color: #fff; min-width: 24px; transition: width 0.4s; }
    .dist-fill.fail { background: var(--red); }

    /* Buttons */
    .btn { padding: 0.5rem 1rem; border-radius: 7px; font-size: 0.73rem; font-weight: 700; cursor: pointer; letter-spacing: 0.07em; text-transform: uppercase; border: 1px solid var(--border2); transition: border-color 0.15s, background 0.15s; white-space: nowrap; align-self: flex-start; }
    .btn-default { background: var(--surface2); color: var(--text); }
    .btn-default:hover { border-color: #4a4a4a; }
    .btn-danger { background: #1a0808; color: var(--red); border-color: #3d1a1a; }
    .btn-danger:hover { background: #2a1010; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .msg { font-size: 0.75rem; color: var(--muted); min-height: 1.2em; }
    .msg.ok  { color: #22c55e; }
    .msg.err { color: var(--red); }

    /* Player lookup */
    .sid-input, .sid-select { background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 0.5rem 0.75rem; color: var(--text); font-size: 0.78rem; font-family: monospace; outline: none; }
    .sid-select { cursor: pointer; width: 100%; }
    .sid-select option { background: var(--surface2); }
    .player-info { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
    .player-info-text { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; line-height: 1.6; }
  </style>
</head>
<body>
<div class="page">
  <header style="display:flex;flex-direction:column;gap:0.4rem">
    <a href="/admin/" class="back">← Admin</a>
    <h1>Words Admin — <span id="dateLabel"></span></h1>
  </header>

  <!-- Today's word -->
  <section>
    <h2>Today's Word</h2>
    <div class="card">
      <div class="today-word" id="todayWord">…</div>
      <div class="today-seed" id="todaySeed"></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-default" id="resetSeedBtn">New Seed / New Word</button>
      <button class="btn btn-default" id="refreshBtn">Refresh</button>
    </div>
    <p class="msg" id="wordMsg"></p>
  </section>

  <!-- Analytics -->
  <section>
    <h2>Today's Stats</h2>
    <div class="stat-grid">
      <div class="stat-tile"><div class="val" id="sPlayers">—</div><div class="lbl">Players</div></div>
      <div class="stat-tile"><div class="val" id="sGuesses">—</div><div class="lbl">Guesses</div></div>
      <div class="stat-tile"><div class="val" id="sWins">—</div><div class="lbl">Wins</div><div class="sub" id="sWinPct"></div></div>
      <div class="stat-tile"><div class="val" id="sLosses">—</div><div class="lbl">Losses</div></div>
    </div>
    <div class="card">
      <div class="dist-list" id="distList"><p class="msg">Loading…</p></div>
    </div>
  </section>

  <!-- Player Lookup -->
  <section>
    <h2>Player Lookup</h2>
    <select id="sidSelect" class="sid-select">
      <option value="">— Select a known player —</option>
    </select>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <input id="sidInput" type="text" placeholder="Or paste session ID…" class="sid-input" style="flex:1">
      <button class="btn btn-default" id="lookupBtn">Look Up</button>
    </div>
    <div class="player-info" id="playerInfo">
      <div class="player-info-text" id="playerInfoText"></div>
      <div class="btn-group">
        <button class="btn btn-danger" id="resetStateBtn">Reset Game State</button>
        <button class="btn btn-danger" id="resetAchBtn">Reset Achievements</button>
      </div>
    </div>
    <p class="msg" id="lookupMsg"></p>
  </section>
</div>

<script>
  function todayStr() {
    const n = new Date();
    return `${n.getUTCFullYear()}-${String(n.getUTCMonth()+1).padStart(2,'0')}-${String(n.getUTCDate()).padStart(2,'0')}`;
  }
  function pct(n, d) { return d ? Math.round(n / d * 100) + '%' : '—'; }

  const TODAY = todayStr();
  document.getElementById('dateLabel').textContent = TODAY;

  function setWordMsg(text, type = '') {
    const el = document.getElementById('wordMsg');
    el.textContent = text; el.className = `msg ${type}`;
    if (text) setTimeout(() => { if (el.textContent === text) { el.textContent = ''; el.className = 'msg'; } }, 3000);
  }

  async function loadWordAndStats() {
    try {
      const data = await fetch(`/admin/api/words/config?date=${TODAY}`).then(r => r.json());
      document.getElementById('todayWord').textContent = data.word || '—';
      document.getElementById('todaySeed').textContent = data.seed
        ? `Seed: ${data.seed.match(/.{4}/g).join(' ')}`
        : 'No seed yet';

      const s   = data.stats || {};
      const won = s.wins || 0;
      const total = (s.wins || 0) + (s.losses || 0);
      document.getElementById('sPlayers').textContent = s.uniquePlayers ?? 0;
      document.getElementById('sGuesses').textContent = s.totalGuesses  ?? 0;
      document.getElementById('sWins').textContent    = won;
      document.getElementById('sWinPct').textContent  = pct(won, total);
      document.getElementById('sLosses').textContent  = s.losses ?? 0;

      const dist = s.distribution || {};
      const maxVal = Math.max(1, ...Object.values(dist));
      const keys   = ['1','2','3','4','5','6','X'];
      document.getElementById('distList').innerHTML = keys.map(k => {
        const count = dist[k] || 0;
        const w     = Math.round(count / maxVal * 100);
        return `<div class="dist-row">
          <div class="dist-label">${k}</div>
          <div class="dist-track"><div class="dist-fill${k === 'X' ? ' fail' : ''}" style="width:${w}%">${count || ''}</div></div>
        </div>`;
      }).join('');
    } catch {
      document.getElementById('todayWord').textContent = 'Error loading';
    }
  }

  document.getElementById('resetSeedBtn').addEventListener('click', async () => {
    if (!confirm('Generate a new seed and word for today? Active players will see a different word.')) return;
    try {
      const data = await fetch(`/admin/api/words/config?date=${TODAY}`, { method: 'DELETE' }).then(r => r.json());
      document.getElementById('todayWord').textContent = data.word || '—';
      document.getElementById('todaySeed').textContent = data.seed ? `Seed: ${data.seed.match(/.{4}/g).join(' ')}` : '';
      setWordMsg('New seed and word generated.', 'ok');
    } catch { setWordMsg('Failed.', 'err'); }
  });

  document.getElementById('refreshBtn').addEventListener('click', () => { loadWordAndStats(); });

  // ── Player Lookup ──────────────────────────────────────────────────────────
  function setLookupMsg(text, type = '') {
    const el = document.getElementById('lookupMsg');
    el.textContent = text; el.className = `msg ${type}`;
  }

  async function populateSidDropdown() {
    try {
      const players = await fetch('/admin/api/achievements').then(r => r.json());
      const sel = document.getElementById('sidSelect');
      players.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.sid;
        opt.textContent = `…${p.sid.slice(-12)}  (${p.achievements.length} ach)`;
        sel.appendChild(opt);
      });
    } catch {}
  }

  document.getElementById('sidSelect').addEventListener('change', function() {
    if (this.value) { document.getElementById('sidInput').value = this.value; document.getElementById('lookupBtn').click(); }
  });

  let currentSid = null;

  document.getElementById('lookupBtn').addEventListener('click', async () => {
    const sid = document.getElementById('sidInput').value.trim();
    if (!sid) { setLookupMsg('Enter a session ID.', 'err'); return; }
    currentSid = sid;
    try {
      const data = await fetch(`/admin/api/words/player?sid=${encodeURIComponent(sid)}&date=${TODAY}`).then(r => r.json());
      const state = data.state;
      const achs  = data.achievements || [];
      const info  = document.getElementById('playerInfoText');
      if (state) {
        const status = state.gameOver ? (state.won ? '✅ Won' : '❌ Lost') : '⏳ In progress';
        info.innerHTML = `<strong>Status:</strong> ${status} · <strong>Guesses:</strong> ${state.guesses?.length ?? 0}<br><strong>Achievements:</strong> ${achs.length}`;
      } else {
        info.innerHTML = `No game state for today. <strong>Achievements:</strong> ${achs.length}`;
      }
      document.getElementById('playerInfo').style.display = '';
      setLookupMsg('');
    } catch { setLookupMsg('Lookup failed.', 'err'); }
  });

  document.getElementById('resetStateBtn').addEventListener('click', async () => {
    if (!currentSid || !confirm('Reset this player\'s Words state for today?')) return;
    try {
      await fetch(`/admin/api/words/player?sid=${encodeURIComponent(currentSid)}&date=${TODAY}`, { method: 'DELETE' });
      setLookupMsg('Game state reset.', 'ok');
      document.getElementById('playerInfo').style.display = 'none';
    } catch { setLookupMsg('Failed.', 'err'); }
  });

  document.getElementById('resetAchBtn').addEventListener('click', async () => {
    if (!currentSid || !confirm('Reset achievements for this player?')) return;
    try {
      await fetch(`/admin/api/achievements?sid=${encodeURIComponent(currentSid)}`, { method: 'DELETE' });
      setLookupMsg('Achievements reset.', 'ok');
      document.getElementById('playerInfo').style.display = 'none';
    } catch { setLookupMsg('Failed.', 'err'); }
  });

  loadWordAndStats();
  populateSidDropdown();
</script>
</body>
</html>
