<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xQc Chatter Quiz</title>
  <link rel="stylesheet" href="/games/chatter-quiz/style.css" />
</head>
<body>
<div class="page">
  <header>
    <div class="header-top">
      <a href="/games/" class="back-link">← Games</a>
      <div class="seed-widget" id="seedWidget">
        <button class="seed-btn" id="seedBtn" title="Today's seed" style="display:none">ⓘ</button>
        <div class="seed-popup" id="seedPopup">
          <div class="seed-popup-label">Today's Seed</div>
          <div class="seed-popup-code" id="seedCode"></div>
          <div class="seed-popup-label" style="margin-top:0.6rem">Session ID</div>
          <div class="seed-popup-code" id="sidCode" style="font-size:0.7rem;color:var(--muted)">—</div>
        </div>
      </div>
    </div>
    <h1>xQc Chatter Quiz</h1>
    <p class="subtitle">Which chatter said this? · 10 questions daily</p>
  </header>

  <p class="msg" id="loading">Loading today's quiz…</p>
  <p class="msg error" id="error" style="display:none"></p>

  <div id="game" style="display:none; flex-direction:column; gap:1.25rem">
    <div class="progress-row">
      <div class="progress-dots" id="progressDots"></div>
      <span class="progress-label" id="progressLabel">1 / 5</span>
    </div>

    <div class="message-card" id="messageCard">
      <div class="chat-badge" style="justify-content:space-between">
        <span style="display:flex;align-items:center;gap:0.4rem">
          <svg viewBox="0 0 24 24"><path d="M11.64 5.93h1.43v4.28h-1.43m3.93-4.28H17v4.28h-1.43M7 2L3.43 5.57v12.86h4.28V22l3.58-3.57h2.85L20.57 12V2m-1.43 9.29-2.85 2.85h-2.86l-2.5 2.5v-2.5H7.71V3.43h11.43z"/></svg>
          xQc Chat
        </span>
        <span class="msg-timestamp" id="msgTimestamp"></span>
      </div>
      <p class="message-text" id="messageText"></p>
      <div class="reveal-author"></div>
    </div>

    <div class="answers" id="answers"></div>
    <div class="hint-row">
      <button class="hint-btn" id="hintBtn">
        💡 Hint <span class="hint-count" id="hintCount">3</span>
      </button>
    </div>
  </div>

  <div id="results">
    <div class="results-score" id="resultsScore"></div>
    <div class="results-rows"  id="resultsRows"></div>
    <div class="results-actions">
      <button class="btn-share" id="shareBtn">Copy Result</button>
    </div>
  </div>
  <div class="seed-timer">New seed in <strong id="seedTimerVal">…</strong> · Made with <span class="egg-heart">♥</span> by Vopori</div>
</div>

<div id="toastContainer" style="position:fixed;top:1rem;right:1rem;z-index:999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none"></div>
<script src="/games/identity.js"></script>
<script src="/games/achievements.js"></script>
<script src="game.js"></script>
<script>
  (function() {
    function tick() {
      const now = Date.now();
      const next = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate() + 1);
      const ms = next - now;
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      document.getElementById('seedTimerVal').textContent =
        `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
