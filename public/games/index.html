<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Vopori</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --border: #222;
      --border2: #333;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #fff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem 5rem;
    }

    .page {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      transition: color 0.15s;
      display: inline-block;
    }
    .back-link:hover { color: var(--text); }

    header { display: flex; flex-direction: column; gap: 0.75rem; }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle { color: var(--muted); font-size: 0.875rem; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .game-card:hover {
      border-color: var(--border2);
      background: var(--surface2);
      box-shadow: 0 0 20px rgba(255,255,255,0.04);
    }

    .game-icon { font-size: 2rem; line-height: 1; }

    .game-card h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .game-card p {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--border2);
      border-radius: 4px;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="/" class="back-link">← Vopori</a>
      <h1>Games</h1>
      <p class="subtitle">Daily games — new challenge every day.</p>
    </header>

    <div class="games-grid">
      <a href="/games/songless/" class="game-card">
        <div class="game-icon">🎵</div>
        <h2>Songless</h2>
        <p>Guess the song from a short audio clip. Six tries, each revealing a little more.</p>
        <span class="badge">Daily</span>
      </a>
    </div>
  </div>
</body>
</html>
