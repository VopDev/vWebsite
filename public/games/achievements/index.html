<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements — Vopori</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
      --border: #222; --border2: #333; --text: #f0f0f0; --muted: #666;
      --gold: #f59e0b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; justify-content: center;
      padding: 3rem 1rem 5rem;
    }
    .page { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 2.5rem; }

    .back-link { color: var(--muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.05em; transition: color 0.15s; }
    .back-link:hover { color: var(--text); }

    h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.5rem; }

    /* Two-column layout */
    .layout { display: flex; gap: 1.5rem; align-items: flex-start; }
    .main-col { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
    .rank-col { width: 270px; flex-shrink: 0; position: sticky; top: 2rem; }
    @media (max-width: 800px) {
      .layout { flex-direction: column; }
      .rank-col { width: 100%; position: static; order: -1; }
    }

    /* Rank panel */
    .rank-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.5rem 1.25rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    .rank-current { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; text-align: center; }
    .rank-emblem {
      font-size: 3.5rem; line-height: 1;
      filter: drop-shadow(0 0 12px var(--rank-glow, transparent));
    }
    .rank-name {
      font-size: 1.4rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--rank-color, var(--text));
    }
    .rank-pct { font-size: 0.78rem; color: var(--muted); }
    .rank-pct strong { color: var(--text); }

    /* Progress to next */
    .rank-next { display: flex; flex-direction: column; gap: 0.4rem; }
    .rank-next-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .rank-next-track { height: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .rank-next-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

    /* Ladder */
    .rank-ladder { display: flex; flex-direction: column; gap: 0.3rem; }
    .ladder-row {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.45rem 0.6rem; border-radius: 8px;
      border: 1px solid transparent; transition: background 0.15s;
    }
    .ladder-row.active { background: var(--surface2); border-color: var(--border2); }
    .ladder-row.locked { opacity: 0.4; }
    .ladder-icon { font-size: 1.2rem; line-height: 1; flex-shrink: 0; }
    .ladder-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .ladder-name { font-size: 0.78rem; font-weight: 700; }
    .ladder-range { font-size: 0.62rem; color: var(--muted); }
    .ladder-check { font-size: 0.8rem; color: var(--gold); }

    /* Collapsible game section */
    .game-section { display: flex; flex-direction: column; }
    .game-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.25rem; cursor: pointer; user-select: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; transition: border-color 0.15s, background 0.15s;
    }
    .game-header:hover { border-color: var(--border2); background: var(--surface2); }
    .game-header.open { border-radius: 12px 12px 0 0; border-bottom-color: transparent; }
    .game-header-left { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .game-name { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
    .game-progress-row { display: flex; align-items: center; gap: 0.6rem; }
    .game-count { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .game-count strong { color: var(--text); }
    .progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }
    .chevron { width: 18px; height: 18px; flex-shrink: 0; color: var(--muted); transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
    .game-header.open .chevron { transform: rotate(180deg); }

    /* Achievement grid */
    .ach-body { display: none; padding: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; }
    .ach-body.open { display: block; }
    .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.6rem; }
    .ach-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; display: flex; align-items: flex-start; gap: 0.85rem; transition: border-color 0.15s; }
    .ach-card.unlocked { border-color: var(--border2); }
    .ach-card.locked { opacity: 0.35; }
    .ach-icon { font-size: 1.6rem; line-height: 1; flex-shrink: 0; }
    .ach-card.locked .ach-icon { filter: grayscale(1); }
    .ach-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .ach-title { font-size: 0.85rem; font-weight: 700; }
    .ach-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
    .ach-date { font-size: 0.62rem; color: var(--gold); margin-top: 0.15rem; }

    .seed-timer { text-align: center; font-size: 0.68rem; letter-spacing: 0.06em; color: var(--muted); padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .seed-timer strong { color: var(--text); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div class="page">
  <header style="display:flex;flex-direction:column;gap:0.4rem">
    <a href="/games/" class="back-link">← Games</a>
    <h1>Achievements</h1>
    <p class="subtitle" id="progressLabel">Loading…</p>
  </header>

  <div class="layout">
    <div class="main-col" id="achSections"></div>
    <div class="rank-col">
      <div class="rank-panel" id="rankPanel"></div>
    </div>
  </div>

  <div class="seed-timer">New seed in <strong id="seedTimerVal">…</strong></div>
</div>

<script>
  (function() {
    function tick() {
      const now = Date.now();
      const next = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate() + 1);
      const ms = next - now;
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      document.getElementById('seedTimerVal').textContent =
        `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

<script src="/games/achievements.js"></script>
<script>
  const RANKS = [
    { name: 'Bronze',   icon: '🥉', color: '#cd7f32', glow: 'rgba(205,127,50,0.4)',  min: 0,  max: 10  },
    { name: 'Silver',   icon: '🥈', color: '#c0c0c0', glow: 'rgba(192,192,192,0.4)', min: 10, max: 35  },
    { name: 'Gold',     icon: '🥇', color: '#f5b301', glow: 'rgba(245,179,1,0.45)',  min: 35, max: 65  },
    { name: 'Diamond',  icon: '💎', color: '#4dd0e1', glow: 'rgba(77,208,225,0.45)', min: 65, max: 95  },
    { name: 'Platinum', icon: '🏆', color: '#e5e4e2', glow: 'rgba(229,228,226,0.5)', min: 95, max: 100 },
  ];

  function renderRank(pct) {
    let current = RANKS[0];
    for (const r of RANKS) if (pct >= r.min) current = r;
    const idx  = RANKS.indexOf(current);
    const next = RANKS[idx + 1];

    let nextHtml;
    if (next) {
      const span     = next.min - current.min;
      const intoTier = Math.min(100, Math.max(0, Math.round((pct - current.min) / span * 100)));
      const remain   = Math.max(0, next.min - pct);
      nextHtml = `<div class="rank-next">
        <div class="rank-next-label"><span>To ${next.name}</span><span>${remain}% to go</span></div>
        <div class="rank-next-track"><div class="rank-next-fill" style="width:${intoTier}%;background:${next.color}"></div></div>
      </div>`;
    } else {
      nextHtml = `<div class="rank-next">
        <div class="rank-next-label"><span>Max Rank</span><span>★</span></div>
        <div class="rank-next-track"><div class="rank-next-fill" style="width:100%;background:${current.color}"></div></div>
      </div>`;
    }

    const ladder = [...RANKS].reverse().map(r => {
      const isActive = r.name === current.name;
      const reached  = pct >= r.min;
      return `<div class="ladder-row ${isActive ? 'active' : ''} ${reached ? '' : 'locked'}">
        <span class="ladder-icon">${r.icon}</span>
        <div class="ladder-info">
          <span class="ladder-name" style="${isActive ? `color:${r.color}` : ''}">${r.name}</span>
          <span class="ladder-range">${r.min}–${r.max}%</span>
        </div>
        ${reached ? '<span class="ladder-check">✓</span>' : ''}
      </div>`;
    }).join('');

    document.getElementById('rankPanel').innerHTML = `
      <div class="rank-current" style="--rank-color:${current.color};--rank-glow:${current.glow}">
        <div class="rank-emblem">${current.icon}</div>
        <div class="rank-name">${current.name}</div>
        <div class="rank-pct"><strong>${pct}%</strong> complete</div>
      </div>
      ${nextHtml}
      <div class="rank-ladder">${ladder}</div>`;
  }

  async function init() {
    let unlocked = [];
    try { unlocked = await fetch('/api/achievements').then(r => r.json()); } catch {}

    const unlockedMap = Object.fromEntries(unlocked.map(a => [a.id, a]));
    const total     = ALL_ACHIEVEMENTS.length;
    const doneCount = ALL_ACHIEVEMENTS.filter(a => unlockedMap[a.id]).length;
    const overallPct = total ? Math.round(doneCount / total * 100) : 0;

    document.getElementById('progressLabel').innerHTML =
      `<strong style="color:var(--text)">${doneCount}/${total}</strong> achievements unlocked`;

    renderRank(overallPct);

    const games = [...new Set(ALL_ACHIEVEMENTS.map(a => a.game))];

    document.getElementById('achSections').innerHTML = games.map(game => {
      const achs     = ALL_ACHIEVEMENTS.filter(a => a.game === game);
      const gameDone = achs.filter(a => unlockedMap[a.id]).length;
      const pct      = Math.round(gameDone / achs.length * 100);
      const id       = game.replace(/\W+/g, '_');

      const cards = achs.map(a => {
        const entry   = unlockedMap[a.id];
        const dateStr = entry
          ? new Date(entry.unlockedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
          : null;
        return `<div class="ach-card ${entry ? 'unlocked' : 'locked'}">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-info">
            <div class="ach-title">${a.title}</div>
            <div class="ach-desc">${a.desc}</div>
            ${dateStr ? `<div class="ach-date">Unlocked ${dateStr}</div>` : ''}
          </div>
        </div>`;
      }).join('');

      return `<div class="game-section">
        <div class="game-header" id="hdr-${id}" onclick="toggle('${id}')">
          <div class="game-header-left">
            <div class="game-name">${game}</div>
            <div class="game-progress-row">
              <div class="game-count"><strong>${gameDone}</strong>/${achs.length}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
          </div>
          <div class="chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
        <div class="ach-body" id="body-${id}">
          <div class="ach-grid">${cards}</div>
        </div>
      </div>`;
    }).join('');
  }

  function toggle(id) {
    const hdr  = document.getElementById('hdr-'  + id);
    const body = document.getElementById('body-' + id);
    const open = body.classList.toggle('open');
    hdr.classList.toggle('open', open);
  }

  init();
</script>
</body>
</html>
