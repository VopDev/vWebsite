<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements — Vopori</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
      --border: #222; --border2: #333; --text: #f0f0f0; --muted: #666;
      --gold: #f59e0b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; justify-content: center;
      padding: 3rem 1rem 5rem;
    }
    .page { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 2.5rem; }

    .back-link { color: var(--muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.05em; transition: color 0.15s; }
    .back-link:hover { color: var(--text); }

    h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.5rem; }

    /* Two-column layout */
    .layout { display: flex; gap: 1.5rem; align-items: flex-start; }
    .main-col { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
    .rank-col { width: 270px; flex-shrink: 0; position: sticky; top: 2rem; }
    @media (max-width: 800px) {
      .layout { flex-direction: column; }
      .rank-col { width: 100%; position: static; order: -1; }
    }

    /* Rank panel */
    .rank-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.5rem 1.25rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    .rank-current { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; text-align: center; }
    .rank-emblem {
      font-size: 3.5rem; line-height: 1;
      filter: drop-shadow(0 0 12px var(--rank-glow, transparent));
    }
    .rank-name {
      font-size: 1.4rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--rank-color, var(--text));
    }
    .rank-pct { font-size: 0.78rem; color: var(--muted); }
    .rank-pct strong { color: var(--text); }

    /* Progress to next */
    .rank-next { display: flex; flex-direction: column; gap: 0.4rem; }
    .rank-next-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .rank-next-track { height: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .rank-next-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

    /* Ladder */
    .rank-ladder { display: flex; flex-direction: column; gap: 0.3rem; }
    .ladder-row {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.45rem 0.6rem; border-radius: 8px;
      border: 1px solid transparent; transition: background 0.15s;
    }
    .ladder-row.active { background: var(--surface2); border-color: var(--border2); }
    .ladder-row.locked { opacity: 0.4; }
    .ladder-icon { font-size: 1.2rem; line-height: 1; flex-shrink: 0; }
    .ladder-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .ladder-name { font-size: 0.78rem; font-weight: 700; }
    .ladder-range { font-size: 0.62rem; color: var(--muted); }
    .ladder-check { font-size: 0.8rem; color: var(--gold); }

    /* Collapsible game section */
    .game-section { display: flex; flex-direction: column; }
    .game-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.25rem; cursor: pointer; user-select: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; transition: border-color 0.15s, background 0.15s;
    }
    .game-header:hover { border-color: var(--border2); background: var(--surface2); }
    .game-header.open { border-radius: 12px 12px 0 0; border-bottom-color: transparent; }
    .game-header-left { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .game-name { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
    .game-progress-row { display: flex; align-items: center; gap: 0.6rem; }
    .game-count { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .game-count strong { color: var(--text); }
    .progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }
    .chevron { width: 18px; height: 18px; flex-shrink: 0; color: var(--muted); transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
    .game-header.open .chevron { transform: rotate(180deg); }

    /* Achievement grid */
    .ach-body { display: none; padding: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; }
    .ach-body.open { display: block; }
    .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.6rem; }
    .ach-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; display: flex; align-items: flex-start; gap: 0.85rem; transition: border-color 0.15s; }
    .ach-card.unlocked { border-color: var(--border2); }
    .ach-card.locked { opacity: 0.35; }
    .ach-card.secret.locked { opacity: 0.6; border-style: dashed; }
    .ach-card.secret.locked .ach-title { letter-spacing: 0.2em; color: var(--muted); }
    .ach-icon { font-size: 1.6rem; line-height: 1; flex-shrink: 0; }
    .ach-card.locked .ach-icon { filter: grayscale(1); }
    .ach-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .ach-title { font-size: 0.85rem; font-weight: 700; }
    .ach-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
    .ach-date { font-size: 0.62rem; color: var(--gold); margin-top: 0.15rem; }

    .seed-timer { text-align: center; font-size: 0.68rem; letter-spacing: 0.06em; color: var(--muted); padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .seed-timer strong { color: var(--text); font-variant-numeric: tabular-nums; }

    /* Profile / username card */
    .profile-card { display: flex; align-items: center; gap: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; }
    .profile-avatar { font-size: 2rem; line-height: 1; width: 3rem; height: 3rem; flex: none; display: flex; align-items: center; justify-content: center; background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px; }
    .profile-main { flex: 1; min-width: 0; }
    .profile-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem; }
    .profile-name { font-size: 1.3rem; font-weight: 800; color: var(--text); word-break: break-word; }
    .profile-edit { margin-top: 0.7rem; }
    .profile-edit input { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border2); border-radius: 9px; color: var(--text); padding: 0.55rem 0.7rem; font-size: 1rem; outline: none; }
    .profile-edit input:focus { border-color: var(--gold); }
    .profile-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.55rem; }
    .profile-btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 9px; padding: 0.45rem 0.9rem; font-size: 0.85rem; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .profile-btn:hover { border-color: var(--gold); }
    .profile-btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1200; font-weight: 700; }
    .profile-btn.primary:hover { filter: brightness(1.08); }
    .profile-btn:disabled { opacity: 0.55; cursor: default; }
    .profile-msg { margin-top: 0.45rem; font-size: 0.8rem; min-height: 1.1em; }
    .profile-msg.err { color: #ef5350; }
    .profile-msg.ok { color: #66bb6a; }
    .profile-lockrow { margin-top: 0.7rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .profile-lock-state { font-size: 0.78rem; color: var(--muted); }
    .profile-lock-state.locked { color: var(--gold); }
    .profile-btn.lock { font-size: 0.8rem; }
    .profile-lockrow .profile-msg { flex-basis: 100%; margin-top: 0.1rem; }
    @media (max-width: 480px) { .profile-card { flex-wrap: wrap; } }
  </style>
</head>
<body>
<div class="page">
  <header style="display:flex;flex-direction:column;gap:0.4rem">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem">
      <a href="/games/" class="back-link">← Games</a>
      <a href="/admin" data-admin-only hidden class="back-link" style="color:#ef4444;font-weight:700">⚙ Admin Portal</a>
    </div>
    <h1>Achievements</h1>
    <p class="subtitle" id="progressLabel">Loading…</p>
  </header>

  <section class="profile-card" id="profileCard">
    <div class="profile-avatar">🙂</div>
    <div class="profile-main">
      <div class="profile-label">Your username</div>
      <div class="profile-name" id="profileName">…</div>
      <div class="profile-edit" id="profileEdit" hidden>
        <input id="usernameInput" type="text" maxlength="16" placeholder="Choose a username"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="profile-actions">
          <button class="profile-btn primary" id="usernameSave">Save</button>
          <button class="profile-btn" id="usernameRandom">Randomize</button>
          <button class="profile-btn" id="usernameCancel">Cancel</button>
        </div>
        <div class="profile-msg" id="usernameMsg"></div>
      </div>
      <div class="profile-lockrow" id="lockRow" hidden>
        <span class="profile-lock-state" id="lockState"></span>
        <button class="profile-btn lock" id="lockBtn" hidden></button>
        <button class="profile-btn" id="recoverBtn" hidden>Restore a locked profile</button>
        <div class="profile-msg" id="lockMsg"></div>
      </div>
    </div>
    <button class="profile-btn" id="usernameEditBtn">Edit</button>
  </section>

  <div class="layout">
    <div class="main-col" id="achSections"></div>
    <div class="rank-col">
      <div class="rank-panel" id="rankPanel"></div>
    </div>
  </div>

  <div class="seed-timer">New seed in <strong id="seedTimerVal">…</strong> · Made with <span class="egg-heart">♥</span> by Vopori</div>
</div>

<script>
  (function() {
    function tick() {
      const now = Date.now();
      const next = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate() + 1);
      const ms = next - now;
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      document.getElementById('seedTimerVal').textContent =
        `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

<script src="/games/identity.js"></script>
<script src="/games/passkey.js"></script>
<script src="/games/achievements.js"></script>
<script>
  const RANKS = [
    { name: 'Bronze',   icon: '🥉', color: '#cd7f32', glow: 'rgba(205,127,50,0.4)',  min: 0,  max: 10  },
    { name: 'Silver',   icon: '🥈', color: '#c0c0c0', glow: 'rgba(192,192,192,0.4)', min: 10, max: 35  },
    { name: 'Gold',     icon: '🥇', color: '#f5b301', glow: 'rgba(245,179,1,0.45)',  min: 35, max: 65  },
    { name: 'Diamond',  icon: '💎', color: '#4dd0e1', glow: 'rgba(77,208,225,0.45)', min: 65, max: 95  },
    { name: 'Platinum', icon: '🏆', color: '#e5e4e2', glow: 'rgba(229,228,226,0.5)', min: 95, max: 100 },
  ];

  function renderRank(pct) {
    let current = RANKS[0];
    for (const r of RANKS) if (pct >= r.min) current = r;
    const idx  = RANKS.indexOf(current);
    const next = RANKS[idx + 1];

    let nextHtml;
    if (next) {
      const span     = next.min - current.min;
      const intoTier = Math.min(100, Math.max(0, Math.round((pct - current.min) / span * 100)));
      const remain   = Math.max(0, next.min - pct);
      nextHtml = `<div class="rank-next">
        <div class="rank-next-label"><span>To ${next.name}</span><span>${remain}% to go</span></div>
        <div class="rank-next-track"><div class="rank-next-fill" style="width:${intoTier}%;background:${next.color}"></div></div>
      </div>`;
    } else {
      nextHtml = `<div class="rank-next">
        <div class="rank-next-label"><span>Max Rank</span><span>★</span></div>
        <div class="rank-next-track"><div class="rank-next-fill" style="width:100%;background:${current.color}"></div></div>
      </div>`;
    }

    const ladder = [...RANKS].reverse().map(r => {
      const isActive = r.name === current.name;
      const reached  = pct >= r.min;
      return `<div class="ladder-row ${isActive ? 'active' : ''} ${reached ? '' : 'locked'}">
        <span class="ladder-icon">${r.icon}</span>
        <div class="ladder-info">
          <span class="ladder-name" style="${isActive ? `color:${r.color}` : ''}">${r.name}</span>
          <span class="ladder-range">${r.min}–${r.max}%</span>
        </div>
        ${reached ? '<span class="ladder-check">✓</span>' : ''}
      </div>`;
    }).join('');

    document.getElementById('rankPanel').innerHTML = `
      <div class="rank-current" style="--rank-color:${current.color};--rank-glow:${current.glow}">
        <div class="rank-emblem" id="rankEmblem" style="cursor:pointer">${current.icon}</div>
        <div class="rank-name">${current.name}</div>
        <div class="rank-pct"><strong>${pct}%</strong> complete</div>
      </div>
      ${nextHtml}
      <div class="rank-ladder">${ladder}</div>`;

    // Easter egg: click the emblem 5 times
    let emblemClicks = 0;
    document.getElementById('rankEmblem').addEventListener('click', () => {
      if (++emblemClicks >= 5) { emblemClicks = 0; eggUnlock('egg_collector'); }
    });
  }

  async function init() {
    let unlocked = [];
    try { unlocked = await fetch('/api/achievements').then(r => r.json()); } catch {}

    const unlockedMap = Object.fromEntries(unlocked.map(a => [a.id, a]));
    const total     = ALL_ACHIEVEMENTS.length;
    const doneCount = ALL_ACHIEVEMENTS.filter(a => unlockedMap[a.id]).length;
    const overallPct = total ? Math.round(doneCount / total * 100) : 0;

    document.getElementById('progressLabel').innerHTML =
      `<strong style="color:var(--text)">${doneCount}/${total}</strong> achievements unlocked`;

    renderRank(overallPct);

    const games = [...new Set(ALL_ACHIEVEMENTS.map(a => a.game))];

    document.getElementById('achSections').innerHTML = games.map(game => {
      const achs     = ALL_ACHIEVEMENTS.filter(a => a.game === game);
      const gameDone = achs.filter(a => unlockedMap[a.id]).length;
      const pct      = Math.round(gameDone / achs.length * 100);
      const id       = game.replace(/\W+/g, '_');

      const cards = achs.map(a => {
        const entry   = unlockedMap[a.id];
        const dateStr = entry
          ? new Date(entry.unlockedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
          : null;
        const hidden = a.secret && !entry;
        const icon   = hidden ? '❓' : a.icon;
        const title  = hidden ? '???' : a.title;
        const desc   = hidden ? (a.hint || 'Hidden achievement') : a.desc;
        return `<div class="ach-card ${entry ? 'unlocked' : 'locked'}${a.secret ? ' secret' : ''}">
          <div class="ach-icon">${icon}</div>
          <div class="ach-info">
            <div class="ach-title">${title}</div>
            <div class="ach-desc">${desc}</div>
            ${dateStr ? `<div class="ach-date">Unlocked ${dateStr}</div>` : ''}
          </div>
        </div>`;
      }).join('');

      return `<div class="game-section">
        <div class="game-header" id="hdr-${id}" onclick="toggle('${id}')">
          <div class="game-header-left">
            <div class="game-name">${game}</div>
            <div class="game-progress-row">
              <div class="game-count"><strong>${gameDone}</strong>/${achs.length}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
          </div>
          <div class="chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
        <div class="ach-body" id="body-${id}">
          <div class="ach-grid">${cards}</div>
        </div>
      </div>`;
    }).join('');
  }

  function toggle(id) {
    const hdr  = document.getElementById('hdr-'  + id);
    const body = document.getElementById('body-' + id);
    const open = body.classList.toggle('open');
    hdr.classList.toggle('open', open);
  }

  init();
</script>

<script>
  // ── Username editor ───────────────────────────────────────────────────────
  (function () {
    const nameEl   = document.getElementById('profileName');
    const editWrap = document.getElementById('profileEdit');
    const editBtn  = document.getElementById('usernameEditBtn');
    const input    = document.getElementById('usernameInput');
    const saveBtn  = document.getElementById('usernameSave');
    const randBtn  = document.getElementById('usernameRandom');
    const cancel   = document.getElementById('usernameCancel');
    const msg      = document.getElementById('usernameMsg');
    const lockRow   = document.getElementById('lockRow');
    const lockState = document.getElementById('lockState');
    const lockBtn   = document.getElementById('lockBtn');
    const recoverBtn= document.getElementById('recoverBtn');
    const lockMsg   = document.getElementById('lockMsg');

    let current = { handle: '', custom: false, locked: false };
    // A short-lived elevation token from a fresh passkey tap (sent on save).
    let elevation = null;
    let elevationExp = 0;

    function showMsg(text, kind) {
      msg.textContent = text || '';
      msg.className = 'profile-msg' + (text ? ' ' + kind : '');
    }
    function showLockMsg(text, kind) {
      lockMsg.textContent = text || '';
      lockMsg.className = 'profile-msg' + (text ? ' ' + kind : '');
    }
    function openEdit() {
      input.value = current.custom ? current.handle : '';
      editWrap.hidden = false;
      editBtn.hidden = true;
      showMsg('');
      input.focus();
    }
    function closeEdit() {
      editWrap.hidden = true;
      editBtn.hidden = false;
      showMsg('');
    }

    // Staff/admins get a red name + a Staff/Admin badge.
    function renderName() {
      nameEl.textContent = current.handle || '—';
      nameEl.style.color = current.staff ? 'var(--red, #ef4444)' : '';
      if (current.staff) {
        const b = document.createElement('span');
        b.textContent = current.role === 'admin' ? 'Admin' : 'Staff';
        b.style.cssText = 'display:inline-block;margin-left:0.5rem;padding:0.1em 0.45em;font-size:0.6rem;font-weight:800;' +
          'letter-spacing:0.06em;text-transform:uppercase;color:#ef4444;background:#1a0808;border:1px solid #3d1a1a;' +
          'border-radius:5px;vertical-align:middle';
        nameEl.appendChild(b);
      }
    }

    async function load() {
      try {
        const r = await fetch('/api/profile');
        current = await r.json();
      } catch { current = { handle: '—', custom: false, locked: false }; }
      renderName();
      renderLock();
    }

    function freshElevation() {
      return elevation && Date.now() / 1000 < elevationExp - 5;
    }

    async function save(name) {
      saveBtn.disabled = true;
      randBtn.disabled = true;
      showMsg('Saving…', 'ok');
      try {
        // Locked profile → require a fresh passkey tap before saving.
        if (current.locked && !freshElevation()) {
          showMsg('Verify with your passkey…', 'ok');
          const { elevation: e } = await window.Passkey.elevate();
          elevation = e;
          elevationExp = parseInt(e.split('.')[0], 10);
        }
        const headers = { 'Content-Type': 'application/json' };
        if (current.locked && elevation) headers['X-Elevation'] = elevation;

        const r = await fetch('/api/profile', { method: 'POST', headers, body: JSON.stringify({ name }) });
        const d = await r.json();
        if (!r.ok) { showMsg(d.error || 'Could not save.', 'err'); return; }
        current = { handle: d.handle, custom: d.custom, locked: d.locked, role: d.role, staff: d.staff };
        renderName();
        showMsg(d.custom ? 'Saved!' : 'Reset to a random name.', 'ok');
        setTimeout(closeEdit, 800);
      } catch (err) {
        showMsg(err.message || 'Network error. Please try again.', 'err');
      } finally {
        saveBtn.disabled = false;
        randBtn.disabled = false;
      }
    }

    // ── Passkey lock UI ──────────────────────────────────────────────────────
    async function renderLock() {
      const Passkey = window.Passkey;
      if (!Passkey || !Passkey.supported()) { lockRow.hidden = true; return; }

      let st = { configured: false, locked: current.locked };
      try { st = await Passkey.status(); } catch {}
      if (!st.configured) { lockRow.hidden = true; return; }   // ID_SECRET not set yet

      current.locked = st.locked;
      lockRow.hidden = false;
      showLockMsg('');

      if (st.locked) {
        lockState.textContent = '🔒 Profile locked with a passkey';
        lockState.className = 'profile-lock-state locked';
        lockBtn.textContent = 'Remove lock';
        lockBtn.hidden = false;
        recoverBtn.hidden = true;
      } else {
        lockState.textContent = '🔓 Not locked';
        lockState.className = 'profile-lock-state';
        lockBtn.textContent = 'Lock with a passkey';
        lockBtn.hidden = false;
        recoverBtn.hidden = false;
      }
    }

    async function doLock() {
      lockBtn.disabled = true;
      showLockMsg('Follow your device prompt…', 'ok');
      try {
        await window.Passkey.lock();
        showLockMsg('Profile locked! Changes now require your passkey.', 'ok');
        await load();
      } catch (err) {
        showLockMsg(err.message || 'Could not lock.', 'err');
      } finally {
        lockBtn.disabled = false;
      }
    }

    async function doUnlock() {
      lockBtn.disabled = true;
      showLockMsg('Verify with your passkey to unlock…', 'ok');
      try {
        await window.Passkey.unlock();
        elevation = null;
        showLockMsg('Lock removed.', 'ok');
        await load();
      } catch (err) {
        showLockMsg(err.message || 'Could not unlock.', 'err');
      } finally {
        lockBtn.disabled = false;
      }
    }

    async function doRecover() {
      recoverBtn.disabled = true;
      showLockMsg('Choose your passkey…', 'ok');
      try {
        await window.Passkey.recover(); // adopts the restored identity token
        showLockMsg('Profile restored on this device!', 'ok');
        await load();
      } catch (err) {
        showLockMsg(err.message || 'Could not restore.', 'err');
      } finally {
        recoverBtn.disabled = false;
      }
    }

    editBtn.addEventListener('click', openEdit);
    cancel.addEventListener('click', closeEdit);
    saveBtn.addEventListener('click', () => save(input.value));
    randBtn.addEventListener('click', () => save(''));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); save(input.value); }
      if (e.key === 'Escape') closeEdit();
    });
    lockBtn.addEventListener('click', () => (current.locked ? doUnlock() : doLock()));
    recoverBtn.addEventListener('click', doRecover);

    load();
  })();
</script>
</body>
</html>
