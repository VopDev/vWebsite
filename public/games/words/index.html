<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words — Daily Word Game</title>
  <link rel="stylesheet" href="/games/words/style.css" />
</head>
<body>
<div class="page">
  <header>
    <div class="header-top">
      <a href="/games/" class="back-link">← Games</a>
      <div class="seed-widget" id="seedWidget">
        <button class="seed-btn" id="seedBtn" title="Info" style="display:none">ⓘ</button>
        <div class="seed-popup" id="seedPopup">
          <div class="seed-popup-label">Today's Seed</div>
          <div class="seed-popup-code" id="seedCode"></div>
          <div class="seed-popup-label" style="margin-top:0.6rem">Session ID</div>
          <div class="seed-popup-code" id="sidCode" style="font-size:0.7rem;color:var(--muted)">—</div>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
      <h1>Words</h1>
      <span class="hard-badge" id="hardBadge" style="display:none">⚡ Hard</span>
    </div>
    <p class="subtitle" id="subtitle">Guess the 5-letter word · 6 tries</p>
  </header>

  <p class="msg" id="loading">Loading…</p>

  <div id="game" style="display:none;flex-direction:column;gap:1rem">
    <div class="hard-timer-row" id="hardTimerRow">
      <div class="hard-timer-track"><div class="hard-timer-fill" id="hardTimerFill" style="width:100%"></div></div>
      <span class="hard-timer-num" id="hardTimerNum">60</span>
    </div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="keyboard" id="keyboard"></div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-word"  id="resultWord"></div>
    <div class="result-emoji" id="resultEmoji"></div>
    <button class="btn-share" id="shareBtn">Copy Result</button>
  </div>

  <div class="seed-timer">New seed in <strong id="seedTimerVal">…</strong> · Made with <span class="egg-heart">♥</span> by Vopori</div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="toastContainer" style="position:fixed;top:1rem;right:1rem;z-index:999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none"></div>

<script src="/games/achievements.js"></script>
<script src="game.js"></script>
<script>
  (function() {
    function tick() {
      const now = Date.now();
      const next = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate() + 1);
      const ms = next - now;
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      document.getElementById('seedTimerVal').textContent =
        `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    }
    tick(); setInterval(tick, 1000);
  })();
</script>
</body>
</html>
